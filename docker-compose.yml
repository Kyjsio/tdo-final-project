services:
  api:
    build: .
    restart: on-failure
    ports:
      - "6666:6666"
    environment:
      - DATABASE_URL=postgresql://myuser:12345@db:5432/finaldb
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "6666"]
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=finaldb
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d finaldb"]
      interval: 5s
      timeout: 5s
      retries: 10
  
      
  migrate:
    build: .
    environment:
      - DATABASE_URL=postgresql://myuser:12345@db:5432/finaldb
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network: